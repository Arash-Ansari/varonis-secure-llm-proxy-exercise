services:
  mitmproxy:
    # Pin a released mitmproxy image so every machine runs the same version.
    image: mitmproxy/mitmproxy:12.3.1
    command:
      - mitmdump
      - --mode
      - reverse:https://api.openai.com@8443
      - --certs
      - "*=/certs/mitmproxy.pem"
      - --set
      - confdir=/tmp/mitmproxy
      # Use the configured local certificate instead of looking up OpenAI's certificate.
      - --set
      - upstream_cert=false
      # Wait to connect to OpenAI until the addon has inspected the request.
      - --set
      - connection_strategy=lazy
      - -s
      - /addons/guardian_observe.py
    environment:
      # The optional CPU Compose file adds the vLLM service at this address.
      GUARDIAN_URL: http://vllm:8000/v1/chat/completions
      GUARDIAN_MODEL: ibm-granite/granite-guardian-3.0-2b
      GUARDIAN_TIMEOUT_SECONDS: "120"
      # Set this host variable to true only to exercise response blocking end-to-end.
      FORCE_RESPONSE_BLOCK_FOR_TEST:
    volumes:
      - ./certs:/certs:ro
      - ./mitmproxy/addons:/addons:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8443), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    # Use a specific version to ensure reproducibility, and the small Alpine Linux base.
    image: nginx:1.31.8-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      mitmproxy:
        condition: service_healthy
