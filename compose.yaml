services:
  mitmproxy:
    # Pin a released mitmproxy image so every machine runs the same version.
    image: mitmproxy/mitmproxy:12.3.1
    command:
      - mitmdump
      - --mode
      - reverse:https://api.openai.com@8443
      - --certs
      - "*=/certs/mitmproxy.pem"
      - --set
      - confdir=/tmp/mitmproxy
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8443), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    # Use a spesific version to ensure reproducibility, and the small Alpine Linux base.
    image: nginx:1.31.8-alpine
    ports:
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      mitmproxy:
        condition: service_healthy
